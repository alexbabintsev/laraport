name: Feature request
description: Something laraport should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The job, and how you do it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like laraport to do
    validations:
      required: true
